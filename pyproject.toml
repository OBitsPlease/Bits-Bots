[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bitsbots"
version = "0.0.1a0"
description = "Local multi-timeframe crypto scanner and paper trader for NonKYC"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23,<26",
    "cryptography>=42,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pyinstaller>=6.10,<7",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
bitsbots = "bitsbots.main:run"
bitsbots-import = "bitsbots.import_history:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bitsbots = ["static/*"]
